name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      note:
        description: 'Trigger note'
        required: false
        default: 'manual'
        type: string

stages:
  build:
    name: Build
    jobs:
      hello:
        name: Smoke Test
        runs-on: [ubuntu-latest, x64, small]
        steps:
          - name: Checkout source code
            uses: checkout
          - name: Run build
            run: echo "build success: ${{ inputs.note }}"
